name: Kernel-Monitor-Mode-Elite-Build
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Official Xiaomi Source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss source
          
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel (Safe & Stable)
        run: |
          cd source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # تنظيف وبدء على بياض
          make clean && make mrproper
          
          # إعداد الملف الأساسي
          make dandelion_defconfig
          
          # تفعيل وضع المراقبة (Monitor Mode)
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_CFG80211_WEXT
          
          # تعطيل المسببات التقليدية للأخطاء
          ./scripts/config --disable CONFIG_IKCONFIG
          ./scripts/config --disable CONFIG_IKCONFIG_PROC
          
          # تحديث الإعدادات
          make olddefconfig
          
          # الاستراتيجية الجديدة: بناء هادئ لتجنب انهيار الذاكرة (Memory Leak)
          # استخدمنا -j2 بدلاً من nproc لضمان استقرار الـ Linking في النهاية
          make KCFLAGS="-fcommon -w" HOSTCFLAGS="-fcommon -w" -j2

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Dandelion-Final-V63
          path: source/arch/arm64/boot/Image.gz-dtb
