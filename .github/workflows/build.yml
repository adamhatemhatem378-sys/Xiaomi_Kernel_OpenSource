name: Kernel-Monitor-Mode-Final
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Python 2
        run: |
          sudo apt-get update
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Install Build Tools
        run: |
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Locate Config and Build
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Searching for config files..."
          # عرض كل ملفات الـ config المتاحة عشان نعرف الاسم الصح
          find . -name "*defconfig"
          
          # محاولة إيجاد الملف المطلوب بمرونة أكبر
          CONF_FILE=$(find . -name "*dandelion*defconfig" | head -n 1)
          
          if [ -z "$CONF_FILE" ]; then
            echo "Searching for ANY config if dandelion failed..."
            CONF_FILE=$(find arch/arm64/configs/ -name "*_defconfig" | head -n 1)
          fi

          echo "Found config at: $CONF_FILE"
          
          # تفعيل وضع المراقبة
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=y/g' "$CONF_FILE"
          echo "CONFIG_MAC80211=y" >> "$CONF_FILE"
          
          CONF_NAME=$(basename "$CONF_FILE")
          make "$CONF_NAME"
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Dandelion-MonitorMode
          path: arch/arm64/boot/Image.gz-dtb
