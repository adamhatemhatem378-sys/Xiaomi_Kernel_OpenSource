name: Kernel-Monitor-Mode-Final-Success
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Official Xiaomi Source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss source
          
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel with Monitor Mode
        run: |
          cd source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # إعداد الملف الأساسي
          make dandelion_defconfig
          
          # تفعيل وضع المراقبة (Monitor Mode)
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_CFG80211_WEXT
          
          # حل مشكلة yylloc والموافقة على الإعدادات
          make olddefconfig
          
          # البناء مع إضافة خاصية التغاضي عن أخطاء المترجم القديمة
          make KCFLAGS="-fcommon" HOSTCFLAGS="-fcommon" -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Dandelion-Final
          path: source/arch/arm64/boot/Image.gz-dtb
