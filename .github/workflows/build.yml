name: Kernel-Monitor-Mode-Final
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Python 2 (The Right Way)
        run: |
          sudo apt-get update
          sudo apt-get install -y python2
          # ربط بايثون 2 عشان الكيرنل يشوفه
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Install Build Tools
        run: |
          sudo apt-get install -y build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # تفعيل وضع المراقبة (Monitor Mode)
          sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=y/g' arch/arm64/configs/dandelion_user_defconfig
          echo "CONFIG_MAC80211=y" >> arch/arm64/configs/dandelion_user_defconfig
          
          make dandelion_user_defconfig
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Dandelion-MonitorMode
          path: arch/arm64/boot/Image.gz-dtb
