name: Build Kernel Monitor Mode
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu libssl-dev libncurses5-dev git

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # تفعيل وضع المراقبة برمجياً قبل البناء
          scripts/config --file arch/arm64/configs/dandelion_user_defconfig -e CFG80211
          scripts/config --file arch/arm64/configs/dandelion_user_defconfig -e MAC80211
          
          make dandelion_user_defconfig
          make -j$(nproc)
          
