name: Build Kernel Automatically

# يشتغل أول ما تعمل push على الفرع main
on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest

    steps:
    # أول خطوة: نسخ الريبو كله
    - uses: actions/checkout@v3

    # إعداد الكومبايلر
    - name: Install Compiler
      run: sudo apt update && sudo apt install -y clang gcc make bc

    # بناء الكيرنل
    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out dandelion_defconfig
        make -j$(nproc) O=out

    # رفع النتيجة كـ artifact
    - name: Upload Kernel
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz-dtb
