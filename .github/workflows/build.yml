name: Kernel-Monitor-Mode-Final-Victory
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Official Xiaomi Source
        run: |
          git clone --depth 1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b dandelion-q-oss source
          
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel (The Final Fix)
        run: |
          cd source
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # تنظيف شامل للسورس كود
          make clean && make mrproper
          
          # إعداد الملف الأساسي
          make dandelion_defconfig
          
          # تفعيل وضع المراقبة (Monitor Mode)
          ./scripts/config --enable CONFIG_CFG80211
          ./scripts/config --enable CONFIG_MAC80211
          ./scripts/config --enable CONFIG_CFG80211_WEXT
          
          # حل المشكلة اللي في الصور (تعطيل ضغط الإعدادات)
          ./scripts/config --disable CONFIG_IKCONFIG
          ./scripts/config --disable CONFIG_IKCONFIG_PROC
          
          # تحديث الإعدادات بهدوء
          make olddefconfig
          
          # البناء النهائي (استخدمنا -j1 عشان السيرفر يركز في ملف واحد وميفصلش)
          # المرة دي هتاخد وقت أطول (حوالي ٤٠ دقيقة) بس ده أضمن طريق للملف
          make KCFLAGS="-fcommon" HOSTCFLAGS="-fcommon" -j1

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Dandelion-Final
          path: source/arch/arm64/boot/Image.gz-dtb
