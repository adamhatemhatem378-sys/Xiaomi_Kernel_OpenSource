name: Kernel-Monitor-Mode-Final
on:
  push:
    branches:
      - dandelion-q-oss
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 build-essential bc libssl-dev libncurses5-dev git gcc-aarch64-linux-gnu
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Force Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # محاولة إيجاد أي ملف، ولو ملقاش هيعمل defconfig افتراضي
          CONF_FILE=$(find . -name "*defconfig" | head -n 1)
          
          if [ -n "$CONF_FILE" ]; then
             CONF_NAME=$(basename "$CONF_FILE")
             echo "Found your config: $CONF_NAME"
             make "$CONF_NAME"
          else
             echo "No config found in your code! Using generic defconfig..."
             make defconfig
          fi

          # تفعيل وضع المراقبة إجبارياً
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          
          make -j$(nproc)

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Result
          path: arch/arm64/boot/Image*
