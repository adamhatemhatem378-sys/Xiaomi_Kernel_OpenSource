name: Build Kernel Automatically

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Compiler
      run: sudo apt update && sudo apt install -y clang gcc make bc

    - name: Build Kernel
      run: |
        mkdir -p out
        make O=out dandelion_defconfig
        make -j$(nproc) O=out

    - name: Upload Kernel
      uses: actions/upload-artifact@v3
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz-dtb
